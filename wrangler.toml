name = "cor"
main = "src/index.ts"
compatibility_date = "2026-10-27"
workers_dev = true

[observability]
enabled = true

[vars]
DEFAULT_CHOIR_SLUG = "tabor"
B2_ENDPOINT = "https://s3.us-east-005.backblazeb2.com"
B2_REGION = "us-east-005"
B2_BUCKET = "choir-tabor-media-1"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/dashboard*"]

[[d1_databases]]
binding = "DB"
database_name = "choir-app-db"
database_id = "3c474dab-d80e-46c4-91de-40c236ba8e67"
migrations_dir = "migrations"

# Create these R2 buckets in the dedicated Tabor Cloudflare account before
# uncommenting and binding them. Keep private master files in the private bucket.
# [[r2_buckets]]
# binding = "MEDIA_PUBLIC"
# bucket_name = "choir-media-public"
#
# [[r2_buckets]]
# binding = "MEDIA_PRIVATE"
# bucket_name = "choir-masters-private"
#
# Do not add API tokens or other secrets to this file.

# Isolated database and variables for Cloudflare Worker Previews.
[previews.vars]
DEFAULT_CHOIR_SLUG = "tabor"

[[previews.d1_databases]]
binding = "DB"
database_name = "choir-app-preview"
database_id = "490af251-9e3c-45cd-adc4-7ca41e6f633a"
migrations_dir = "migrations"
