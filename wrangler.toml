name = "cor"
main = "src/index.ts"
compatibility_date = "2026-10-27"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# D1 binding: create the database first, then uncomment and replace DATABASE_ID.
# [[d1_databases]]
# binding = "DB"
# database_name = "choir-app-db"
# database_id = "REPLACE_WITH_REAL_D1_DATABASE_ID"
# migrations_dir = "migrations"

# R2 bindings: create each bucket in the target Cloudflare account first.
# [[r2_buckets]]
# binding = "MEDIA_PUBLIC"
# bucket_name = "choir-media-public"
#
# [[r2_buckets]]
# binding = "MEDIA_PRIVATE"
# bucket_name = "choir-masters-private"
#
# Do not add API tokens or other secrets to this file.
