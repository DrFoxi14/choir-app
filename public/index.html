<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172554">
  <meta name="description" content="Materialele muzicale ale corului, organizate simplu pentru fiecare voce.">
  <title>Choir App · Corul Tabor</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand-mark" aria-hidden="true">♪</div>
      <div>
        <p class="eyebrow">CORUL TABOR</p>
        <h1>Choir App</h1>
      </div>
      <button id="change-voice" class="text-button hidden" type="button">Schimbă vocea</button>
    </header>

    <section id="voice-screen" class="panel voice-panel" aria-labelledby="voice-title">
      <p class="eyebrow">BINE AI VENIT</p>
      <h2 id="voice-title">Ce voce cânți?</h2>
      <p class="muted">Alege vocea o singură dată pe acest dispozitiv. În versiunea cu cont, preferința va fi asociată contului tău.</p>
      <div class="voice-grid" role="group" aria-label="Alege vocea">
        <button class="voice-choice" data-voice="S" type="button"><strong>S</strong><span>Soprano</span></button>
        <button class="voice-choice" data-voice="A" type="button"><strong>A</strong><span>Alto</span></button>
        <button class="voice-choice" data-voice="T" type="button"><strong>T</strong><span>Tenor</span></button>
        <button class="voice-choice" data-voice="B" type="button"><strong>B</strong><span>Bass</span></button>
      </div>
    </section>

    <section id="catalog-screen" class="catalog hidden" aria-labelledby="catalog-title">
      <div class="catalog-heading">
        <div>
          <p class="eyebrow">MATERIALELE TALE</p>
          <h2 id="catalog-title">Cântări</h2>
        </div>
        <span id="voice-badge" class="voice-badge"></span>
      </div>
      <p id="catalog-message" class="muted" role="status">Se încarcă repertoriul…</p>
      <div id="song-list" class="song-list"></div>
    </section>

    <footer>
      <p>Corul Tabor · Choir App</p>
      <p id="app-status">Se verifică starea aplicației…</p>
    </footer>
  </main>
</body>
</html>
