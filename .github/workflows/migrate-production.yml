name: Apply Choir App production D1 migrations

on:
  push:
    branches:
      - feature/account-colors-attendance-export
      - feature/backblaze-b2-media
    paths:
      - "migrations/**"
      - "wrangler.toml"
      - ".github/workflows/migrate-production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: choir-app-production-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require explicit deployment enablement
        if: ${{ vars.ENABLE_CLOUDFLARE_DEPLOY != 'true' }}
        run: |
          echo "::error::Production migration is disabled. Set repository Actions variable ENABLE_CLOUDFLARE_DEPLOY to true only when ready."
          exit 1

      - name: Check Cloudflare credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "::error::Missing GitHub Actions secrets CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check Worker and validate migrations locally
        run: |
          npm run typecheck
          python3 tests/schema_smoke.py

      - name: List remote D1 migrations
        run: npx wrangler d1 migrations list choir-app-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply pending D1 migrations before code is merged to main
        run: npx wrangler d1 migrations apply choir-app-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
