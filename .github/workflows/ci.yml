name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check Worker
        run: npm run typecheck

      - name: Validate Wrangler configuration and Worker bundle
        run: npx wrangler deploy --dry-run

      - name: Check browser JavaScript syntax
        run: |
          node --check public/app.js
          node --check public/invitation.js
          node --check public/account.js
          node --check public/attendance.js

      - name: Smoke-test D1 migrations
        run: python3 tests/schema_smoke.py

      - name: Smoke-test isolated Preview configuration
        run: python3 tests/preview_config_smoke.py

      - name: Smoke-test protected invitation contacts
        run: python3 tests/invitation_contact_security_smoke.py

      - name: Smoke-test account and attendance routes
        run: python3 tests/account_attendance_routes_smoke.py

      - name: Smoke-test Backblaze media integration
        run: python3 tests/backblaze_media_smoke.py

      - name: Smoke-test private media download safeguards
        run: python3 tests/media_download_security_smoke.py

      - name: Smoke-test one-paste Preview D1 bootstrap
        run: python3 tests/preview_d1_bootstrap_smoke.py
